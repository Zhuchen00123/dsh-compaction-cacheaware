name: Sync Reasonix compact

on:
  schedule:
    # Weekly review is sufficient for an upstream compact design sync.
    # Sunday 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync Reasonix compact
        run: node scripts/sync-reasonix-compact.mjs

      - name: Validate generated package
        run: |
          npm install --legacy-peer-deps --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

      - name: Detect changes
        id: git
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/update PR
        if: steps.git.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(reasonix): sync compact implementation'
          branch: reasonix-compact-sync
          delete-branch: true
          title: 'Sync Reasonix compact implementation'
          body: |
            Automated sync from `esengine/DeepSeek-Reasonix`.

            This PR updates:
            - `vendor/reasonix/compact/` (compatible upstream compact source/docs)
            - `src/generated/reasonix-constants.ts` and compiled `lib/`

            The sync always refreshes the discovered upstream snapshot and writes
            a report, including when the implementation shape changes. Review
            the diff and port-drift report before merging; removed constants keep
            their last local fallback only while the port still consumes them.
          labels: dependencies, reasonix
